<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วีซ่าอุมเราะห์ ซาอุดีอาระเบีย</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- โหลด LIFF SDK ที่หน้าแรกด้วย เพื่อให้ handshake สมบูรณ์ -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>
<body>

    <div class="mobile-container">
        <header class="header-bar">
            <div class="logo">
                <img src="img/logo-with-text white 1.svg" alt="ALHURAH LTD PART.">
            </div>
            <div class="header-title">วีซ่า ซาอุดิอาระเบีย</div>
        </header>

        <main class="card-list">
            <a href="umrah-detail.html" id="umrah-link" style="text-decoration: none; display: block; color: inherit;">
                <div class="card">
                    <img src="img/Group 11.svg" alt="วีซ่าอุมเราะห์" class="card-img">
                    <div class="card-overlay">
                        <h2>วีซ่าอุมเราะห์</h2>
                    </div>
                </div>
            </a>

            <div class="card">
                <img src="img/Group 12.svg" alt="วีซ่าท่องเที่ยว" class="card-img">
                <div class="card-overlay">
                    <h2>วีซ่าท่องเที่ยว</h2>
                </div>
            </div>
        </main>
    </div>

    <script>
        const LIFF_ID = "2008429094-YTq3YOaG";

        (async () => {
            if (typeof liff === "undefined") {
                console.warn("ไม่พบ LIFF SDK - ระบบจะทำงานในรูปแบบ Standalone Web");
                return;
            }
            try {
                await liff.init({ liffId: LIFF_ID });
                console.log("LIFF init สำเร็จที่หน้าแรก");
            } catch (err) {
                console.error("LIFF Init Error (index.html):", err);
            }
        })();
    </script>

</body>
</html>
